<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - CAIBRAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar-custom scrolled" id="navbar">
        <div class="container d-flex justify-content-between align-items-center"><a href="index.html"
                class="logo">CAI<span>BRAN</span></a>
            <nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="story.html">Our Story</a><a
                    href="experience.html">Experience</a><a href="menu.html">Menu</a><a
                    href="gallery.html">Gallery</a><a href="contact.html">Contact</a><a href="reserve.html"
                    class="btn-gold-nav">Reserve a Table</a></nav>
            <div class="d-flex align-items-center gap-3"><button class="cart-icon" onclick="openCart()">🛒 <span
                        id="cartCount">0</span></button>
                <div class="hamburger" onclick="toggleMenu()">☰</div>
            </div>
        </div>
    </header>

    <section class="section dark" style="padding-top:130px">
        <div class="container text-center"><span class="label">GALLERY</span>
            <h2 class="serif text-white">A Feast for the <i>Senses.</i></h2>
            <div class="gallery-grid"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDGkkvK-AirCt3yei7mt7TGdHKoiAlbsQ4hQaTQ3bTOA&s=10"><img
                    src="https://images.unsplash.com/photo-1544025162-d76694265947?w=800"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThdT5vQNSj8xnzLHtjpePPAfRaOhw1vd7CFEANAwgvGQ&s=10"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4XV8kyy-nFrr_mu6UIllgIDRQuwgZr0m6jMA10I_Mlg&s=10"><img
                    src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=800"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbYFuv78erk1yMCagaeCFrFgMf5sqOnFPZn9hXqbXuPg&s=10"></div>
        </div>
    </section>
    <footer>
        <div class="container text-center">
            <p>© 2026 CAIBRAN. All Rights Reserved.</p>
        </div>
    </footer>
    <div id="cartDrawer" class="cart-drawer">
        <div class="d-flex justify-content-between">
            <h3>Your Cart</h3><button class="close-btn" onclick="closeCart()">✕</button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-footer">
            <h4>Total: ₹<span id="cartTotal">0</span></h4><button class="btn-gold w-100"
                onclick="completeDemo()">Complete Demo</button>
        </div>
    </div>
    <div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>
    <div id="demoModal" class="modal-box">
        <div class="modal-content">
            <div class="success">✓</div>
            <h3>Demo Complete!</h3>
            <p>Demo only.</p><button class="btn-gold" onclick="closeModal()">Continue Exploring</button>
        </div>
    </div>
    <div id="toast" class="toast-box"></div>
    <script src="script.js"></script>
</body>

</html>
