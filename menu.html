<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Menu - CAIBRAN</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="navbar-custom scrolled" id="navbar"><div class="container d-flex justify-content-between align-items-center"><a href="index.html" class="logo">CAI<span>BRAN</span></a><nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="story.html">Our Story</a><a href="experience.html">Experience</a><a href="menu.html">Menu</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a><a href="reserve.html" class="btn-gold-nav">Reserve a Table</a></nav><div class="d-flex align-items-center gap-3"><button class="cart-icon" onclick="openCart()">🛒 <span id="cartCount">0</span></button><div class="hamburger" onclick="toggleMenu()">☰</div></div></div></header>
